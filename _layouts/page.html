<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — DrossApps</title>
  <meta name="description" content="{{ page.description | default: 'built small, shared freely, never worthless.' }}">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      max-width: 860px;
      margin: 0 auto;
      padding: 0 20px 80px;
      color: #212529;
      line-height: 1.7;
      background: #fff;
    }
    nav {
      padding: 24px 0;
      border-bottom: 1px solid #dee2e6;
      margin-bottom: 40px;
    }
    nav a {
      color: #495057;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05em;
    }
    nav a:hover { color: #1a1a2e; }
    nav::after { content: ''; display: block; clear: both; }
    .breadcrumb { float: right; color: #adb5bd; font-size: 0.9em; margin-top: 4px; }
    .breadcrumb a { color: #6c757d; font-weight: normal; }
    h1 { font-size: 2.2em; color: #1a1a2e; margin: 0 0 8px; letter-spacing: -0.5px; }
    h2 { font-size: 1.7em; color: #1a1a2e; margin: 48px 0 16px; }
    h3 { font-size: 1.25em; color: #1a1a2e; margin: 32px 0 12px; }
    p { margin: 0 0 16px; }
    a { color: #0f3460; }
    a:hover { text-decoration: underline; }
    hr { border: none; border-top: 1px solid #dee2e6; margin: 48px 0; }
    code { background: #f8f9fa; padding: 2px 6px; border-radius: 4px; font-size: 0.9em; }
    pre { background: #f8f9fa; padding: 20px; border-radius: 8px; overflow-x: auto; }
    blockquote { border-left: 4px solid #0f3460; margin: 24px 0; padding: 8px 0 8px 20px; color: #495057; }
    ul, ol { padding-left: 24px; margin: 0 0 16px; }
    li { margin-bottom: 6px; }
    img { max-width: 100%; height: auto; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; margin: 24px 0; }
    th, td { border: 1px solid #dee2e6; padding: 10px 14px; text-align: left; }
    th { background: #f8f9fa; font-weight: 600; }
  </style>
</head>
<body>
  <nav>
    <a href="/">DrossApps</a>
    {% if page.url != "/" %}
    <span class="breadcrumb">→ <a href="{{ page.url }}">{{ page.title }}</a></span>
    {% endif %}
  </nav>

  {{ content }}

  <hr>
  <p style="text-align:center; color: #adb5bd; font-size: 0.85em; margin-top: 40px;">
    <a href="/">DrossApps</a> · built small, shared freely, never worthless.
  </p>
</body>
</html>
